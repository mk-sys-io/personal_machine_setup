# Idle-suspend policy: no GPU jobs alive across suspend, so skip VRAM
# save/restore for fast suspend and no /var/tmp I/O.
options nvidia NVreg_PreserveVideoMemoryAllocations=0
# Flip to 1 if you start suspending with CUDA jobs alive or use
# hibernate (needs GBs free in /var/tmp, slower suspend).
# Check vendor nvidia.conf on each driver bump — pinned params won't prompt.
# Kernel cmdline nvidia.<param>=... beats this file; don't set one.
