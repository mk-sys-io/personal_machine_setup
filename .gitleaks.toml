# LOCAL-ONLY FORK — not deployed anywhere.
#
# The deployed policy is dev/git/gitleaks.toml; `make dev` copies it to
# ~/.config/gitleaks/gitleaks.toml (machine-wide, what the pre-commit hook
# pins with -c) and to ~/.config/init/gitleaks.toml (what `init` points
# per-repo extenders at). This file is never copied.
#
# It exists so a hand-run `gitleaks` inside this repo picks up a config
# automatically (no -c, no GITLEAKS_CONFIG) — mainly to keep the .gpg
# allowlist in force for the gopass store blobs.
#
# Sync it MANUALLY: this file and dev/git/gitleaks.toml should differ only in
# `title`. If you change one, change the other.

title = "linux_setup gitleaks config"

[extend]
useDefault = true

# NOTE: singular [allowlist] (not [[allowlists]]) — the installed binary
# (Debian trixie gitleaks 8.16.0) predates the v8.25 plural rename and
# silently ignores [[allowlists]] blocks. Singular stays accepted by newer
# releases (backwards-compatible) and gitleaks is feature-frozen, so this
# syntax is safe indefinitely.
[allowlist]
description = "Template/example placeholders + GPG-encrypted secret stores (.gpg blobs are opaque ciphertext; the only reason a rule can fire on them is a gpg-diff textconv decrypting for diff)"
paths = [
    '''\.template$''',
    '''\.example$''',
    '''\.gpg$''',
]
