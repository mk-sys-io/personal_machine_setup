name: openrouter
base_url: https://openrouter.ai/api/v1
auth: env/OPENROUTER_API_KEY
catalog:
  endpoint: /models
  models_path: data
free_detection:
  rules:
    - type: suffix
      value: [":free"]
    - type: pricing_zero
capabilities:
  include_keywords: [chat, mini, preview]
  exclude_keywords: [embedding, rerank, whisper, tts, image, imagine, moderation]
