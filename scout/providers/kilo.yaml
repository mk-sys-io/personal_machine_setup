name: kilo
base_url: https://ai-gateway.kilo.ai/api/v1
auth: env/KILO_API_KEY
catalog:
  endpoint: /models
  models_path: data
free_detection:
  rules:
    - type: suffix
      value: [":free", "-free"]
    - type: pricing_zero
    - type: flag
      key: isFree
capabilities:
  include_keywords: [chat, mini, preview]
  exclude_keywords: [embedding, rerank, whisper, tts, image, imagine, moderation]
