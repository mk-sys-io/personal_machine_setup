// LibreWolf overrides.cfg — applied to ALL profiles on every launch.
// Portable: no profile pinning, works regardless of install path.
// Deployed to ~/.config/librewolf/librewolf/librewolf.overrides.cfg
// Docs: https://librewolf.net/docs/settings/

// Default search engine → SearXNG (self-hosted, localhost:8888)
pref("keyword.URL", "http://127.0.0.1:8888/search?q=");

// Dark theme — proper approach.
// LibreWolf enables RFP by default, which forces prefers-color-scheme to
// "light" with NO override (maintainer-confirmed, issue #2849). The fix is to
// disable RFP and use the modern Fingerprinting Protection (FPP) instead,
// which supports the -CSSPrefersColorScheme override. This lets the browser
// report dark while keeping other fingerprinting protections active.
pref("privacy.resistFingerprinting", false);
pref("privacy.fingerprintingProtection", true);
pref("privacy.fingerprintingProtection.overrides", "+AllTargets,-CSSPrefersColorScheme");
pref("ui.systemUsesDarkTheme", 1);
pref("browser.theme.dark-private-windows", true);
pref("devtools.theme", "dark");

// Enable userChrome.css (minimal: bookmark-removal rules only)
pref("toolkit.legacyUserProfileCustomizations.stylesheets", true);

// Restore stock UI defaults — override stale prefs persisted in prefs.js
// from the earlier Zen-style overrides.cfg.
pref("sidebar.revamp", false);
pref("sidebar.verticalTabs", false);
pref("browser.compactmode.show", false);
pref("browser.tabs.allowAnimationPreference", true);
pref("browser.tabs.animate", true);
pref("privacy.resistFingerprinting.overrides", "");
