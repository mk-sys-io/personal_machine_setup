# Espanso matches — add triggers here
# See: https://espanso.org/docs/matches/basics/
#
# Example:
#   - trigger: ":hello"
#     replace: "Hello, World!"
#
# Tip: use $mod+Ctrl+e to edit this file quickly.

matches:
  - trigger: ":pev"
    replace: |-
      Spawn one subagent NOW — these can run in parallel. Issue ALL independent reads in the SAME response in ONE parallel block. DO NOT go serial read→wait→read.

      FREE TIER ONLY — agentic coding in OpenCode + Pi agent. Ignore paid plans, embeddings, image, music.

      Evaluate the provider below:

      - Legit or scam? Domain age, owner vs official parent, security reports, red flags.
      - Bait-and-switch? Any allegations of advertising top models but serving cheaper ones under the hood?
      - Free tier nature: permanent? one-time credit/trial? promo? history of overnight cuts with no notice?
      - Free gating: CC, ID, phone, geo required?
      - Top free models for agentic coding: all suitable ones, tool-call support + context window each.
      - Free limits on those models: TPM/RPM/RPD, reset/expiry.
      - Privacy policy: trains on prompts? retention? 3rd-party share? jurisdiction/deletion?
      - Free-tier reliability/latency: uptime, TTFT and tok/s on free models; peak vs off-peak difference?
      - Community consensus 2025-2026 on free tier, with links.
      - Verdict: is the free tier worth using in both agents? Yes/No + why.

      Sources required, mark unknowns unknown.

      Before finishing, confirm: spawned subagent? batched independent reads? If not, state why.

      Provider: $|$

  - trigger: ":run"
    replace: |-
      Execute the plan from this conversation. You are now in build mode.

      1. Locate the plan in YOUR OWN earlier output: read your most recent response, then the one before it. The plan is not in this prompt — do not search here for it.
      2. If neither of those has a plan, reply "Nothing to proceed on" and stop.
      3. Never invent content. If the plan is missing, or key decisions are still ambiguous, STOP and say plainly what is missing or undecided. Do not guess, do not fill gaps.

      Execute one step at a time, tracked with todowrite:
      - Mark a step in_progress before starting it, completed after it is finished and verified.
      - If a step fails, stop and report the failure. Do not continue past it.

      Touch only the files the plan names. If a step is ambiguous, ask me.

      When all steps are done, list the completed todos and every file you modified, created, or deleted.
