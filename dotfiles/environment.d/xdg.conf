# XDG base dirs (30-C). environment.d(5) supports $VAR/${VAR} expansion only;
# systemd unit specifiers like %h are NOT expanded here and reach consumers
# (including the podman quadlet generator) verbatim. ${HOME} works because
# user@.service sets HOME before the environment.d generator runs.
XDG_DATA_HOME=${HOME}/.local/share
XDG_CONFIG_HOME=${HOME}/.config
XDG_STATE_HOME=${HOME}/.local/state
XDG_CACHE_HOME=${HOME}/.cache
