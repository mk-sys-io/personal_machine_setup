#
# This file controls the configuration of the audit daemon
#
# Complete Debian default (auditd package conffile) with desktop customizations.
# Deployed by lib/55-security.sh to /etc/audit/auditd.conf.
# Lines marked ## CUSTOM differ from the package default.
# See: man auditd.conf(5)
#

local_events = yes
write_logs = yes
log_file = /var/log/audit/audit.log
log_group = adm
log_format = ENRICHED
flush = INCREMENTAL_ASYNC
freq = 50
## CUSTOM: 50 MiB per file (default 8), keep 10 files (500 MiB total)
max_log_file = 50
num_logs = 10
priority_boost = 4
name_format = NONE
##name = mydomain
max_log_file_action = ROTATE
space_left = 75
space_left_action = SYSLOG
verify_email = yes
action_mail_acct = root
admin_space_left = 50
## CUSTOM: log to syslog instead of suspending audit on low disk
admin_space_left_action = SYSLOG
## CUSTOM: don't halt the system on disk errors — log and continue
disk_full_action = SYSLOG
disk_error_action = SYSLOG
use_libwrap = yes
##tcp_listen_port = 60
tcp_listen_queue = 5
tcp_max_per_addr = 1
##tcp_client_ports = 1024-65535
tcp_client_max_idle = 0
transport = TCP
krb5_principal = auditd
##krb5_key_file = /etc/audit/audit.key
distribute_network = no
q_depth = 2000
overflow_action = SYSLOG
max_restarts = 10
plugin_dir = /etc/audit/plugins.d
end_of_event_timeout = 2
