## auditd.conf — overrides for desktop use
## Deployed by lib/55-security.sh to /etc/audit/auditd.conf
## Only settings that differ from Debian defaults are listed here.
## See: man auditd.conf(5)

## Log rotation: 50 MiB per file, keep 10 files (500 MiB total)
max_log_file = 50
num_logs = 10

## Flush mode: batch writes to reduce disk I/O pressure
flush = INCREMENTAL_ASYNC
freq = 50

## When max_log_file is reached, rotate (default: SUSPEND is too aggressive)
max_log_file_action = ROTATE

## When disk runs low, log to syslog instead of suspending audit
space_left_action = SYSLOG
admin_space_left_action = SYSLOG

## Don't halt the system on disk errors — log and continue
disk_full_action = SYSLOG
disk_error_action = SYSLOG
