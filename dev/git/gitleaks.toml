title = "gitleaks config"

[extend]
useDefault = true

# NOTE: plural [[allowlists]] — current since the v8.25 multiple-allowlists
# change (#1777). The old singular [allowlist] is deprecated, cannot coexist
# with the plural form on the same scope, and an empty allowlist is a config
# error on new releases. Do NOT add a singular [allowlist] block here.
[[allowlists]]
description = "Template/example placeholders + GPG-encrypted secret stores (.gpg blobs are opaque ciphertext; the only reason a rule can fire on them is a gpg-diff textconv decrypting for diff)"
paths = [
    '''\.template$''',
    '''\.example$''',
    '''\.gpg$''',
]
